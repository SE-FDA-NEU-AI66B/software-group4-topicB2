# Neon-backed Free web service; provisioning/deployment requires operator action.
services:
  - type: web
    name: edusurvey
    runtime: python
    branch: main
    plan: free
    region: singapore
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: pip install -r requirements-postgres.txt
    startCommand: python -m tools.prepare_production && gunicorn --config gunicorn.conf.py src.app:app
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: EDUSURVEY_ENV
        value: production
      - key: EDUSURVEY_DATABASE_BACKEND
        value: postgresql
      - key: DATABASE_URL
        sync: false
      - key: EDUSURVEY_SECRET_KEY
        generateValue: true
