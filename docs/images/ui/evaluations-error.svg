        <text x="720" y="710" text-anchor="middle" class="heading">Unable to load evaluations</text>
        <text x="720" y="740" text-anchor="middle" class="muted">Your session may have expired or the server is unavailable.</text>
        <text x="720" y="770" text-anchor="middle" class="muted">Please try again.</text>
        <rect x="655" y="795" width="130" height="42" rx="8" fill="#1769c2"/>
        <text x="720" y="822" text-anchor="middle" class="white">Try again</text>
        
    <text x="305" y="1020" font-size="11" fill="#9aa6b5">© 2026 EduSurvey</text>
    <text x="1380" y="1020" text-anchor="end" font-size="11" fill="#9aa6b5">University Evaluation System</text>
    </svg>